name: ab-initio-pipeline
# Controller environment — drives Snakemake orchestration for all 3 stages.
# Per-rule compute envs are the other envs/*.yaml, built automatically via
# --use-conda (stages 1 & 3). Stage 2 submits to SLURM via the executor
# plugin and is run from an IFB login node.
#
# Install:
#   conda env create -f envs/controller.yaml
#   conda activate ab-initio-pipeline
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - snakemake>=8.4
  - snakemake-executor-plugin-slurm>=0.11
  - snakemake-wrapper-utils>=0.6
  - datavzrd>=2.36
  - pyyaml>=6.0
  - conda
  - mamba
  - pip
  - pip:
      - snakemake-executor-plugin-slurm     # in case bioconda lags
