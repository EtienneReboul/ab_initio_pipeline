# ─────────────────────────────────────────────────────────────────────────────
# example_toy — ubiquitin homodimer (verification vehicle, not real science)
#
# Two copies of human ubiquitin (P0CG48, 76 aa). ~152 tokens: trivial for
# every ABCfold backend, MMseqs2 returns a deep MSA, PROSITE/InterProScan
# return the ubiquitin domain cleanly, and the flexible C-terminal ...LRGG
# tail gives the disorder / MoRF plots something to show. Use this to smoke-
# test all three stages end-to-end before pointing the pipeline at real data.
# ─────────────────────────────────────────────────────────────────────────────

name: example_toy
size_class: small

sequences:
  - type: protein
    id: A
    name: ubiquitin_A
    uniprot: P0CG48
    region: [1, 76]
    sequence: "MQIFVKTLTGKTITLEVEPSDTIENVKAKIQDKEGIPPDQQRLIFAGKQLEDGRTLSDYNIQKESTLHLVLRLRGG"
  - type: protein
    id: B
    name: ubiquitin_B
    uniprot: P0CG48
    region: [1, 76]
    sequence: "MQIFVKTLTGKTITLEVEPSDTIENVKAKIQDKEGIPPDQQRLIFAGKQLEDGRTLSDYNIQKESTLHLVLRLRGG"

anchor_chains:  [A]
partner_chains: [B]

# No `domains:` block: stage 1's InterPro-based map (ubiquitin fold, from
# P0CG48 residues 1-76) is used as is.

plip_passes:
  - {name: main, dnareceptor: false, fix_pdb: false, chains: "[['A'],['B']]"}

plip_host:
  docker_memory: "8g"
  docker_platform: "linux/amd64"
