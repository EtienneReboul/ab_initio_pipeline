name: ab-initio-annotate
# Stage 1c sequence annotation — domains (ScanProsite + InterPro API /
# InterProScan REST). Disorder/MoRF come from AIUPred's docker image (run by
# scripts/annotate_disorder.py, not installed here); metapredict is only its
# no-docker fallback. All web-service / docker / pip based, so no local databases.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - requests>=2.31
  - biopython>=1.83
  - numpy>=1.26
  - pandas>=2.0
  - pyyaml>=6.0
  - matplotlib>=3.8
  - pip
  - pip:
      - metapredict>=3       # disorder fallback when docker / the AIUPred image is unavailable
