name: ab-initio-metrics
# Stage 3b — PAE-based interface metrics over the full ABCfold ensemble.
# Wraps the vendored tools/ipsae, tools/afm_lis, tools/pinc scripts, feeding
# them per-model PAE reconstructed from results/metadata/<system>/arrays.h5.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy>=1.26
  - pandas>=2.0
  - scipy>=1.11
  - h5py>=3.10
  - gemmi>=0.7
  - pyarrow>=15.0
